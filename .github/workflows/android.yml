name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: "عنوان خادم Aman (اتركه فارغًا للافتراضي 10.0.2.2:8080)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: اختبارات الخادم
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: تثبيت الحزم
        working-directory: server
        run: npm ci
      - name: الاختبارات
        working-directory: server
        run: npm test

  android:
    name: بناء APK
    runs-on: ubuntu-latest
    needs: server
    env:
      # أولوية: مدخل التشغيل اليدوي، ثم متغير المستودع AMAN_API، ثم افتراضي المحاكي.
      AMAN_API: ${{ inputs.api_url || vars.AMAN_API || 'http://10.0.2.2:8080' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: تحميل حزم Flutter
        working-directory: app
        run: flutter pub get

      - name: التحليل الساكن
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: بناء APK
        working-directory: app
        run: flutter build apk --release --dart-define=AMAN_API="$AMAN_API"

      - name: تجهيز ملف APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk aman.apk

      - name: ملخص البناء
        run: |
          APK=aman.apk
          SIZE=$(du -h "$APK" | cut -f1)
          {
            echo "### Aman — تم بناء APK بنجاح"
            echo ""
            echo "- الحجم: **$SIZE**"
            echo "- رابط التحميل المباشر لملف APK (بدون فك ضغط):"
            echo "  https://github.com/${{ github.repository }}/releases/download/latest/aman.apk"
            echo "- عنوان الخادم المضمّن: \`$AMAN_API\`"
            echo "- يمكن تغييره لاحقًا من داخل التطبيق (شاشة الترحيب أو الإعدادات)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aman-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: نشر رابط تحميل مباشر للـ APK في Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Aman v0.5.0 — أحدث نسخة APK جاهزة للتثبيت"
          body: |
            اضغط على ملف **`aman.apk`** بالأسفل لتحميل التطبيق وتثبيته مباشرة على هاتفك (بدون فك ضغط).
          files: aman.apk
          prerelease: false
