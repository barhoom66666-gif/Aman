name: aman
description: "Aman — مراسلة خاصة ومشفّرة من الطرف إلى الطرف"
publish_to: "none"
version: 0.6.0+7

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  # 10.x يستخدم compileSdk الخاص بـ Flutter (36) بدل 34 — مطلوب لتوافق الإضافات.
  file_picker: ^10.3.10
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  uuid: ^4.5.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
